#:schema https://developers.openai.com/codex/config-schema.json

# Runtime model, approval, sandbox, web search, personality, and reasoning
# settings inherit from ~/.codex/config.toml or an explicit --profile layer.

[agents]
max_threads = 4
max_depth = 1

[agents.planner]
description = "Planning lane for sequencing, acceptance criteria, and batch handoff clarity."

[agents.worker]
description = "Execution lane for bounded implementation tasks in the active milestone."

[agents.qa]
description = "Validation lane for tests, build verification, and release evidence."

[agents.release]
description = "Release lane for packaging, notarization preparation, and rollback posture."

[agents.comms]
description = "PM-friendly reporting lane for summaries, docs, and handoff artifacts."
