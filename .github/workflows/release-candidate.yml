name: release-candidate

on:
  workflow_dispatch:
    inputs:
      target:
        description: App target to package as a release candidate
        required: true
        default: questionnaire
        type: choice
        options:
          - questionnaire
          - binder
          - sop
          - all
      release_mode:
        description: Release mode to validate before packaging
        required: true
        default: signed
        type: choice
        options:
          - signed
          - notarized

jobs:
  release-candidate:
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare build output paths
        run: |
          # shellcheck disable=SC1091
          source .codex/actions/_artifact_env.sh
          echo "CODEX_BUILD_RUST_DIR=$CODEX_BUILD_RUST_DIR" >> "$GITHUB_ENV"
          echo "CODEX_LOG_RUN_DIR=$CODEX_LOG_RUN_DIR" >> "$GITHUB_ENV"
      - name: Preflight release environment
        run: |
          bash scripts/check-release-env.sh "${{ inputs.release_mode }}"
      - name: Run release candidate packaging
        run: |
          if [ "${{ inputs.target }}" = "all" ]; then
            bash scripts/release-candidate.sh "${{ inputs.release_mode }}" questionnaire binder sop
          else
            bash scripts/release-candidate.sh "${{ inputs.release_mode }}" "${{ inputs.target }}"
          fi
      - name: Publish workflow summary
        run: |
          summary_path="$CODEX_LOG_RUN_DIR/bundle-evidence/${{ inputs.release_mode }}/bundle-evidence.md"
          if [ -f "$summary_path" ]; then
            cat "$summary_path" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Bundle evidence markdown was not produced." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ inputs.target }}-${{ inputs.release_mode }}
          if-no-files-found: error
          path: |
            ${{ env.CODEX_LOG_RUN_DIR }}/bundle-artifacts/${{ inputs.release_mode }}/**/*.app
            ${{ env.CODEX_LOG_RUN_DIR }}/bundle-artifacts/${{ inputs.release_mode }}/**/*.dmg
      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: bundle-evidence-${{ inputs.target }}-${{ inputs.release_mode }}
          if-no-files-found: error
          path: |
            ${{ env.CODEX_LOG_RUN_DIR }}/bundle-evidence/${{ inputs.release_mode }}/bundle-evidence.md
            ${{ env.CODEX_LOG_RUN_DIR }}/bundle-evidence/${{ inputs.release_mode }}/bundle-evidence.json
